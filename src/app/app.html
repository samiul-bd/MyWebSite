<!-- App Layout Wrapper -->
<div class="min-h-screen flex flex-col md:flex-row bg-[#080d1a] text-slate-100 font-sans selection:bg-blue-600 selection:text-white">
  
  <!-- ================= MOBILE HEADER ================= -->
  <header class="md:hidden flex items-center justify-between px-6 py-4 bg-[#0e1726]/90 backdrop-blur-md border-b border-[#1e293b] sticky top-0 z-40">
    <a routerLink="/" class="flex items-center space-x-2.5" (click)="closeMobileMenu()">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/20">
        S
      </div>
      <span class="font-bold tracking-wider text-white">Samiul Alam</span>
    </a>
    
    <button (click)="toggleMobileMenu()" class="p-2 text-slate-400 hover:text-white transition-colors duration-300 focus:outline-none" aria-label="Toggle Navigation Menu">
      @if (isMobileMenuOpen()) {
        <!-- Close Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      } @else {
        <!-- Hamburger Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      }
    </button>
  </header>

  <!-- ================= SIDEBAR NAVIGATION (Desktop & Mobile Drawer) ================= -->
  <aside [class.translate-x-0]="isMobileMenuOpen()" [class.-translate-x-full]="!isMobileMenuOpen()" 
         class="fixed inset-y-0 left-0 z-30 w-72 md:w-64 bg-[#0e1726]/95 md:bg-[#0e1726] border-r border-[#1e293b]/50 flex flex-col justify-between transition-transform duration-350 ease-in-out md:translate-x-0 md:static md:z-auto shrink-0 shadow-2xl md:shadow-none">
    
    <div>
      <!-- Profile Card -->
      <div class="p-6 border-b border-[#1e293b]/40 text-center">
        <a routerLink="/" (click)="closeMobileMenu()" class="inline-block relative group">
          <!-- Profile Pic with Glowing Border -->
          <div class="absolute -inset-0.5 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-full blur opacity-60 group-hover:opacity-100 transition duration-500"></div>
          <div class="relative w-24 h-24 rounded-full overflow-hidden border-2 border-slate-900 mx-auto">
            <img src="profile.jpg" alt="Samiul Alam" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          </div>
        </a>
        <h2 class="mt-4 font-bold text-lg tracking-wide text-white">Samiul Alam</h2>
        <p class="text-xs font-semibold text-blue-400 mt-1 uppercase tracking-widest">Software Engineer</p>
      </div>

      <!-- Navigation Menu links -->
      <nav class="p-6 space-y-2.5">
        <a routerLink="/about" routerLinkActive="bg-blue-600/10 text-blue-400 border-l-2 border-blue-500 font-semibold"
           class="flex items-center space-x-3.5 px-4 py-3 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800/40 transition-all duration-300"
           (click)="closeMobileMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span>About Me</span>
        </a>

        <a routerLink="/portfolio" routerLinkActive="bg-blue-600/10 text-blue-400 border-l-2 border-blue-500 font-semibold"
           class="flex items-center space-x-3.5 px-4 py-3 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800/40 transition-all duration-300"
           (click)="closeMobileMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
          <span>Portfolio</span>
        </a>

        <a routerLink="/resume" routerLinkActive="bg-blue-600/10 text-blue-400 border-l-2 border-blue-500 font-semibold"
           class="flex items-center space-x-3.5 px-4 py-3 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800/40 transition-all duration-300"
           (click)="closeMobileMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          <span>Resume(current)</span>
        </a>

        <a routerLink="/blog" routerLinkActive="bg-blue-600/10 text-blue-400 border-l-2 border-blue-500 font-semibold"
           class="flex items-center space-x-3.5 px-4 py-3 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800/40 transition-all duration-300"
           (click)="closeMobileMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 4a2 2 0 012 2v6a2 2 0 01-2 2h-2" />
          </svg>
          <span>Blog</span>
        </a>

        <a routerLink="/contact" routerLinkActive="bg-blue-600/10 text-blue-400 border-l-2 border-blue-500 font-semibold"
           class="flex items-center space-x-3.5 px-4 py-3 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800/40 transition-all duration-300"
           (click)="closeMobileMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          <span>Contact</span>
        </a>
      </nav>
    </div>

    <!-- Social links footer in sidebar -->
    <div class="p-6 border-t border-[#1e293b]/40 text-center">
      <div class="flex items-center justify-center space-x-4 mb-3">
        <!-- GitHub link -->
        <a href="https://github.com/samiul-bd" target="_blank" class="text-slate-400 hover:text-white hover:scale-110 transition-all duration-300" aria-label="GitHub Profile">
          <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24">
            <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.579.688.481C19.137 20.162 22 16.418 22 12c0-5.523-4.477-10-10-10z" />
          </svg>
        </a>
        <!-- LinkedIn link -->
        <a href="https://www.linkedin.com/in/samiulalam-bd/" target="_blank" class="text-slate-400 hover:text-white hover:scale-110 transition-all duration-300" aria-label="LinkedIn Profile">
          <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24">
            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
          </svg>
        </a>
      </div>
      <p class="text-[10px] text-slate-500">&copy; 2026. Built with Angular & Tailwind.</p>
    </div>

  </aside>

  <!-- Mobile Backdrop Overlay -->
  @if (isMobileMenuOpen()) {
    <div (click)="closeMobileMenu()" class="fixed inset-0 z-20 bg-black/60 md:hidden backdrop-blur-sm"></div>
  }

  <!-- ================= MAIN CONTENT VIEWPORT ================= -->
  <main class="flex-grow flex flex-col min-w-0">
    <div class="flex-grow p-6 md:p-10 max-w-6xl w-full mx-auto">
      
      <!-- Top subtle gradient glow (Decorative) -->
      <div class="absolute top-0 right-0 w-80 h-80 bg-blue-600/10 rounded-full blur-[100px] pointer-events-none"></div>
      <div class="absolute top-1/3 left-1/4 w-96 h-96 bg-purple-600/5 rounded-full blur-[120px] pointer-events-none"></div>

      <!-- Angular Page Outlet -->
      <router-outlet></router-outlet>
      
    </div>
  </main>

</div>
